# Default nginx fallback for happys.
#
# Purpose:
# - Make shkolakoda.com the explicit default/anchor site.
# - Keep named domain server blocks untouched.
# - Redirect unknown HTTP Host headers and direct-IP HTTP requests to Shkolakoda.
#
# Install:
#   sudo cp /var/www/webgarden/deploy/nginx/default-shkolakoda.conf /etc/nginx/sites-available/default-shkolakoda.conf
#   sudo ln -s /etc/nginx/sites-available/default-shkolakoda.conf /etc/nginx/sites-enabled/00-default-shkolakoda.conf
#   sudo nginx -t
#   sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 301 https://shkolakoda.com/;
}

# Optional HTTPS fallback:
#
# Unknown HTTPS Host requests are constrained by TLS certificate validation:
# clients may see a certificate-name warning before nginx can return a redirect.
# This block is still safe for existing named domains because SNI will select
# their matching server blocks before the default server is used.
#
# To enable HTTPS unknown/default redirect for IPv4, uncomment this block after
# confirming the shkolakoda.com certificate exists on the host:
#
# server {
#     listen 443 ssl default_server;
#     server_name _;
#
#     ssl_certificate /etc/letsencrypt/live/shkolakoda.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/shkolakoda.com/privkey.pem;
#     include /etc/letsencrypt/options-ssl-nginx.conf;
#     ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
#
#     return 301 https://shkolakoda.com/;
# }
