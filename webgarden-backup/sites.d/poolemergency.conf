# PoolEmergency site backup profile.
# The generated Flask app requires PostgreSQL for startup through shared SQLAlchemy.
SITE_NAME=poolemergency
APP_PATH=/var/www/webgarden/sites/poolemergency
ENV_FILE=/etc/webgarden/poolemergency.env
SERVICE_NAME=webgarden-poolemergency.service
DB_TYPE=postgres
DATABASE_URL_VAR=DATABASE_URL
BACKUP_UPLOADS=yes
UPLOAD_PATHS="/var/www/webgarden/uploads/poolemergency /var/www/webgarden/sites/poolemergency/uploads /var/www/webgarden/sites/poolemergency/instance/uploads"
RETENTION_DAYS=30
