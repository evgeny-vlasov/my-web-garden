# Shkolakoda site backup profile.
# Capture the active immutable release, its revision marker, and app source.
# The venv is excluded by backup_app_source and can be rebuilt from requirements.
SITE_NAME=shkolakoda
APP_PATH=/var/www/soccl/current
SERVICE_NAME=webgarden-shkolakoda.service
DB_TYPE=none
BACKUP_UPLOADS=no
UPLOAD_PATHS=""
RETENTION_DAYS=30
