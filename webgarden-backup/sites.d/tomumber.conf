# Tom Umber site backup profile.
# The service still embeds its PostgreSQL connection; the backup script reads it without printing it.
SITE_NAME=tomumber
APP_PATH=/home/fluffy/projects/tomumber
SERVICE_NAME=tomumber.service
DB_TYPE=postgres
DATABASE_URL_VAR=DATABASE_URL
BACKUP_UPLOADS=yes
UPLOAD_PATHS="/home/fluffy/projects/tomumber/uploads /home/fluffy/projects/tomumber/app/uploads"
SQLITE_PATHS="/home/fluffy/projects/tomumber/instance/tomumber.sqlite"
RETENTION_DAYS=30
