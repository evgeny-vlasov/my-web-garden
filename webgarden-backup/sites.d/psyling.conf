# Psyling site backup profile.
# Private CRM/chat data lives in PostgreSQL and in restricted upload paths.
SITE_NAME=psyling
APP_PATH=/var/www/webgarden/sites/psyling
ENV_FILE=/etc/webgarden/psyling.env
SERVICE_NAME=webgarden-psyling.service
DB_TYPE=postgres
DATABASE_URL_VAR=DATABASE_URL
BACKUP_UPLOADS=yes
UPLOAD_PATHS="/var/www/webgarden/uploads/psyling /var/www/webgarden/sites/psyling/uploads /var/www/webgarden/sites/psyling/instance/uploads"
RETENTION_DAYS=30
