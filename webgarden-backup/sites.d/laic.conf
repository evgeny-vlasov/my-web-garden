# LAIC site backup profile.
# Contact submissions live either in PostgreSQL or in the app instance directory.
SITE_NAME=laic
APP_PATH=/var/www/webgarden/sites/laic
ENV_FILE=/etc/webgarden/laic.env
SERVICE_NAME=webgarden-laic.service
DB_TYPE=auto
DATABASE_URL_VAR=DATABASE_URL
BACKUP_UPLOADS=no
UPLOAD_PATHS=""
RETENTION_DAYS=30
