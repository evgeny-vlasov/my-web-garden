# LAIC nginx configuration
#
# Install steps:
#   1. Copy to /etc/nginx/sites-available/laic.ca
#   2. Symlink into /etc/nginx/sites-enabled/
#   3. Run nginx -t
#   4. Reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name laic.ca www.laic.ca;

    access_log /var/log/nginx/laic-access.log;
    error_log /var/log/nginx/laic-error.log;

    location /static/ {
        alias /var/www/webgarden/sites/laic/static/;
        expires 1h;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
