<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="{% block meta_description %}Happy Science Calgary offers hands-on weekend science camps for curious kids ages 7-12.{% endblock %}"
    >
    <title>{% block title %}Happy Science Calgary | Weekend STEM Camps for Kids{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9Oer+R2bKj7Sk3H6zT2A9TjoRaF9T6gF+8abtTE1Pi6jizo"
      crossorigin="anonymous"
    >
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top site-navbar">
      <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">Happy Science Calgary</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
          aria-controls="mainNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto mb-3 mb-lg-0 me-lg-3">
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('home') }}">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('camps') }}">Camps</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('safety') }}">Safety</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('contact') }}">Contact</a>
            </li>
          </ul>
          <div class="d-flex">
            <a class="btn btn-primary" href="{{ url_for('contact') }}">Join interest list</a>
          </div>
        </div>
      </div>
    </nav>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div class="container">
        <div>
          <span>Happy Science Calgary</span>
          <span class="footer-note">Weekend science camps for kids ages 7-12</span>
        </div>
        <a class="footer-link" href="https://shkolakoda.com">Looking for coding classes? Visit School of Code Calgary.</a>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
