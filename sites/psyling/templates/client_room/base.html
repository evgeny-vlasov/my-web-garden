<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <title>{% block title %}Private Messaging Room{% endblock %} - {{ config.SITE_NAME }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <header class="bg-primary text-white py-3"><div class="container" style="max-width: 900px"><strong>Private Messaging</strong></div></header>
    <main class="container py-4" style="max-width: 900px">
        <div class="alert alert-warning"><strong>This messaging room is not for emergencies and is not monitored 24/7.</strong></div>
        {% with notices = get_flashed_messages(with_categories=true) %}{% for category, message in notices %}<div class="alert alert-{{ 'danger' if category == 'error' else category }}">{{ message }}</div>{% endfor %}{% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
