<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 112 96" role="img" aria-labelledby="title desc">
  <title id="title">School of Code compact badge</title>
  <desc id="desc">The letters SC inside angled code brackets on a yellow, ink-bordered badge.</desc>
  <g transform="rotate(-2 50 42)">
    <rect x="4" y="4" width="92" height="76" fill="#f4c542" stroke="#151515" stroke-width="4"/>
