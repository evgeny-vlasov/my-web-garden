<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img" aria-labelledby="title desc">
  <title id="title">School of Code Computer Lab stacked wordmark, monochrome</title>
  <desc id="desc">A one-ink SC badge above a two-line School of Code wordmark.</desc>
  <g transform="translate(210 22) rotate(-2 50 42)">
    <rect x="4" y="4" width="92" height="76" fill="#ffffff" stroke="#151515" stroke-width="4"/>
    <text x="50" y="51" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" letter-spacing="-1.2" text-anchor="middle">&lt;<tspan font-weight="900">SC</tspan>/&gt;</text>
  </g>
  <text x="260" y="190" fill="#151515" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" text-anchor="middle">School of</text>
  <text x="260" y="265" fill="#151515" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" text-anchor="middle">Code</text>
  <text x="260" y="315" fill="#151515" font-family="Aptos, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="2.5" text-anchor="middle">COMPUTER LAB / CALGARY</text>
</svg>
