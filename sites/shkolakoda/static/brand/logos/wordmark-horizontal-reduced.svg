<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 120" role="img" aria-labelledby="title desc">
  <title id="title">School of Code reduced horizontal wordmark</title>
  <desc id="desc">A yellow SC code badge beside the School of Code name, without the Computer Lab Calgary descriptor.</desc>
  <g transform="translate(12 17) rotate(-2 50 42)">
    <rect x="4" y="4" width="92" height="76" fill="#f4c542" stroke="#151515" stroke-width="4"/>
    <text x="50" y="51" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" letter-spacing="-1.2" text-anchor="middle">&lt;<tspan font-weight="900">SC</tspan>/&gt;</text>
  </g>
  <text x="130" y="64" fill="#151515" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="700">School of Code</text>
</svg>
