<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">School of Code portrait social post template</title>
  <desc id="desc">An editable portrait post with the compact identity, a serif question, and a technical coordinate diagram.</desc>
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#d8d6ca" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1080" height="1350" fill="#fffef8"/>
  <rect x="0" y="910" width="1080" height="440" fill="#e9effb"/>
  <rect x="0" y="910" width="1080" height="440" fill="url(#grid)" opacity=".8"/>
  <rect width="1080" height="14" fill="#f4c542"/>
  <g id="brand" transform="translate(72 64)">
    <g transform="rotate(-2 50 42)">
      <rect x="4" y="4" width="92" height="76" fill="#f4c542" stroke="#151515" stroke-width="4"/>
      <text x="50" y="51" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" letter-spacing="-1.2" text-anchor="middle">&lt;<tspan font-weight="900">SC</tspan>/&gt;</text>
    </g>
    <text x="124" y="40" fill="#151515" font-family="Georgia, 'Times New Roman', serif" font-size="35" font-weight="700">School of Code</text>
    <text x="126" y="70" fill="#5c5c57" font-family="Aptos, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="2">COMPUTER LAB / CALGARY</text>
  </g>
  <g id="edit-label" data-edit="eyebrow">
    <path d="M76 248h34" stroke="#147d64" stroke-width="6"/>
    <text x="126" y="256" fill="#147d64" font-family="'Courier New', monospace" font-size="22" font-weight="800" letter-spacing="2.5">ROBOTICS / SENSE + DECIDE</text>
  </g>
  <text id="edit-headline" data-edit="headline" x="72" y="406" fill="#151515" font-family="Georgia, 'Times New Roman', serif" font-size="94" font-weight="700">
    <tspan x="72" dy="0">What will</tspan>
    <tspan x="72" dy="102">your robot</tspan>
    <tspan x="72" dy="102">notice?</tspan>
  </text>
  <g id="edit-summary" data-edit="summary">
    <rect x="72" y="724" width="760" height="118" fill="#ffffff" stroke="#151515" stroke-width="3"/>
    <text x="98" y="770" fill="#151515" font-family="Aptos, 'Segoe UI', Arial, sans-serif" font-size="25" font-weight="700">
      <tspan x="98" dy="0">Measure one input. Choose a threshold.</tspan>
      <tspan x="98" dy="39">Test where the rule breaks.</tspan>
    </text>
  </g>
  <g id="edit-diagram" data-edit="diagram" transform="translate(92 953)">
    <rect x="9" y="9" width="896" height="300" fill="#f4c542"/>
    <rect width="896" height="300" fill="#ffffff" stroke="#151515" stroke-width="4"/>
    <path d="M48 150h800M448 28v244" stroke="#151515" stroke-width="3"/>
    <circle cx="268" cy="90" r="17" fill="#c93d32" stroke="#151515" stroke-width="3"/>
    <circle cx="590" cy="205" r="17" fill="#147d64" stroke="#151515" stroke-width="3"/>
    <text x="292" y="83" fill="#151515" font-family="'Courier New', monospace" font-size="20" font-weight="800">TOO CLOSE / STOP</text>
    <text x="615" y="198" fill="#151515" font-family="'Courier New', monospace" font-size="20" font-weight="800">CLEAR / MOVE</text>
    <text x="840" y="177" fill="#151515" font-family="'Courier New', monospace" font-size="17" font-weight="800">+X</text>
    <text x="463" y="49" fill="#151515" font-family="'Courier New', monospace" font-size="17" font-weight="800">+Y</text>
  </g>
  <text id="edit-url" data-edit="url" x="994" y="1310" fill="#2257b5" font-family="'Courier New', monospace" font-size="20" font-weight="800" text-anchor="end">SHKOLAKODA.COM</text>
</svg>
