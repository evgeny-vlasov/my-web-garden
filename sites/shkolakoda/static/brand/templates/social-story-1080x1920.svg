<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">School of Code vertical Story template</title>
  <desc id="desc">An editable paper-and-ink vertical Story with a compact institutional mark, large headline, graph-paper control loop, and protected edge spacing.</desc>
  <metadata id="story-safe-area-constants" data-canvas-width="1080" data-canvas-height="1920" data-safe-left="64" data-safe-top="280" data-safe-right="1016" data-safe-bottom="1520" data-safe-width="952" data-safe-height="1240"/>
  <defs>
    <pattern id="story-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ebe9de" stroke-width="2"/>
    </pattern>
    <pattern id="story-dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#151515" opacity=".18"/>
    </pattern>
  </defs>

  <rect width="1080" height="1920" fill="#fffef8"/>
  <rect width="1080" height="16" fill="#f4c542"/>
  <path d="M720 0h360v760H720z" fill="url(#story-grid)"/>
  <path d="M0 1420h420v500H0z" fill="url(#story-dots)"/>

  <g id="editor-guide" data-export="exclude" data-safe-left="64" data-safe-top="280" data-safe-right="1016" data-safe-bottom="1520" aria-hidden="true">
    <rect id="story-safe-area-guide" x="64" y="280" width="952" height="1240" fill="none" stroke="#d8d6ca" stroke-width="2" stroke-dasharray="12 12"/>
    <text x="76" y="262" fill="#5c5c57" font-family="'Courier New', monospace" font-size="17" font-weight="700" letter-spacing="2">EDITOR GUIDE / LIVE AREA: X 64–1016 / Y 280–1520 / REMOVE BEFORE EXPORT</text>
  </g>

  <g id="story-live-content">
  <g id="story-brand" transform="translate(74 296)">
    <g transform="rotate(-2 50 42)">
      <rect x="5" y="5" width="96" height="80" fill="#f4c542" stroke="#151515" stroke-width="5"/>
      <text x="53" y="55" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" letter-spacing="-1.2" text-anchor="middle">&lt;<tspan font-weight="900">SC</tspan>/&gt;</text>
    </g>
    <text x="132" y="43" fill="#151515" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700">School of Code</text>
    <text x="134" y="77" fill="#5c5c57" font-family="Aptos, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="2.2">COMPUTER LAB / CALGARY</text>
  </g>

  <g id="story-edit-eyebrow" data-edit="eyebrow" transform="translate(76 420)">
    <path d="M0 0h42" stroke="#147d64" stroke-width="7"/>
    <text x="62" y="8" fill="#147d64" font-family="'Courier New', monospace" font-size="24" font-weight="800" letter-spacing="3">LAB NOTE / 07</text>
  </g>

  <g id="story-edit-headline" data-edit="headline">
    <text x="72" y="560" fill="#151515" font-family="Georgia, 'Times New Roman', serif" font-size="116" font-weight="700">
      <tspan x="72" dy="0">Make the</tspan>
      <tspan x="72" dy="120">machine</tspan>
      <tspan x="72" dy="120">answer.</tspan>
    </text>
  </g>

  <g id="story-control-loop" transform="translate(72 840)">
    <rect x="10" y="10" width="936" height="470" fill="#151515" opacity=".12"/>
    <rect width="936" height="470" fill="#ffffff" stroke="#151515" stroke-width="5"/>
    <rect width="936" height="64" fill="#e2f4ed"/>
    <text x="24" y="41" fill="#075b47" font-family="'Courier New', monospace" font-size="22" font-weight="900" letter-spacing="2">CONTROL LOOP / INPUT → RULE → OUTPUT</text>

    <path d="M164 250H426V170H682" fill="none" stroke="#147d64" stroke-width="8"/>
    <circle cx="164" cy="250" r="25" fill="#f4c542" stroke="#151515" stroke-width="5"/>
    <rect x="404" y="144" width="52" height="52" fill="#e9effb" stroke="#151515" stroke-width="5" transform="rotate(45 430 170)"/>
    <circle cx="682" cy="170" r="25" fill="#f4c542" stroke="#151515" stroke-width="5"/>
    <path d="M682 195v104H814" fill="none" stroke="#147d64" stroke-width="8"/>
    <path d="m794 280 28 19-28 19" fill="none" stroke="#151515" stroke-width="6"/>

    <g id="story-edit-supporting-points" data-edit="supporting-points" font-family="'Courier New', monospace" font-size="23" font-weight="900">
      <text x="108" y="327" fill="#151515">SENSE</text>
      <text x="372" y="116" fill="#151515">DECIDE</text>
      <text x="628" y="116" fill="#151515">ACT</text>
      <text x="108" y="405" fill="#5c5c57">BUILD / TEST / CHANGE ONE RULE</text>
    </g>
  </g>

  <g id="story-edit-callout" data-edit="callout" transform="translate(120 1340) rotate(-1)">
    <rect x="8" y="8" width="744" height="118" fill="#151515" opacity=".14"/>
    <rect width="744" height="118" fill="#f4c542" stroke="#151515" stroke-width="4"/>
    <text x="28" y="48" fill="#151515" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700">A bug is a clue.</text>
    <text x="28" y="86" fill="#151515" font-family="'Courier New', monospace" font-size="19" font-weight="800">RUN IT / READ IT / TRY AGAIN</text>
  </g>

  <path d="M875 1340v120H710" fill="none" stroke="#147d64" stroke-width="7"/>
  <circle cx="875" cy="1340" r="17" fill="#f4c542" stroke="#151515" stroke-width="5"/>
  <circle cx="710" cy="1460" r="17" fill="#f4c542" stroke="#151515" stroke-width="5"/>

  <text id="story-edit-url" data-edit="url" x="1006" y="1500" fill="#2257b5" font-family="'Courier New', monospace" font-size="22" font-weight="900" text-anchor="end">SHKOLAKODA.COM</text>
  </g>
</svg>
