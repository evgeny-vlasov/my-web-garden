name: SoCCL Deploy

on:
  push:
    branches: [main]
    paths:
      - "sites/shkolakoda/**"
      - ".github/workflows/soccl-deploy.yml"
  workflow_dispatch:
    inputs:
      revision:
        description: Commit, tag, or branch to redeploy
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: soccl-production-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify website revision
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    defaults:
      run:
        working-directory: sites/shkolakoda
    steps:
      - name: Check out requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.revision || github.sha }}

      - name: Resolve verified commit
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sites/shkolakoda/requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Validate Git-backed publications
        run: python -m publishing --check

      - name: Run SoCCL tests
        run: python -m unittest discover -s tests -v

  deploy:
    name: Deploy website only
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: soccl-production
    steps:
      - name: Check out verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Configure deployment SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.SOCCL_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.SOCCL_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Request SoCCL website deployment
        env:
          DEPLOY_HOST: ${{ secrets.SOCCL_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.SOCCL_DEPLOY_USER }}
          REVISION: ${{ needs.verify.outputs.sha }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" /usr/local/bin/soccl-deploy "$REVISION"
