name: SoCCL CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate School of Code Computer Lab
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sites/shkolakoda
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sites/shkolakoda/requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Validate Git-backed publications
        run: python -m publishing --check

      - name: Run SoCCL tests
        run: python -m unittest discover -s tests -v
